name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        # 3.9 is the oldest supported (the python3 in macOS Command Line Tools).
        python: ["3.9", "3.13"]
        exclude:   # setup-python has no 3.9 build for these runner images; 3.9 is covered on Windows
          - os: macos-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Unit tests
        run: python -m pytest -q
      - name: Config is valid JSON
        run: python -c "import json; json.load(open('config/workstation.json'))"
      - name: check runs without crashing
        # Checks are expected to fail on a bare runner; this only proves the code runs.
        shell: bash
        run: python -m workstation check --json > results.json || true; python -c "import json; assert json.load(open('results.json'))"
      - name: install dry run
        run: python -m workstation install --dry-run --git-name ci --git-email ci@example.invalid

  bootstrap:
    name: Bootstrap scripts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck setup.sh
        if: runner.os == 'Linux'
        run: shellcheck setup.sh
      - name: setup.sh dry run
        if: runner.os == 'Linux'
        run: sh setup.sh install --dry-run --git-name ci --git-email ci@example.invalid
      - name: PSScriptAnalyzer on setup.ps1
        if: runner.os == 'Windows'
        shell: powershell   # Windows PowerShell 5.1, which setup.ps1 targets
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
          $findings = Invoke-ScriptAnalyzer -Path .\setup.ps1 -Settings .\PSScriptAnalyzerSettings.psd1
          $findings | Format-Table Line, RuleName, Message -AutoSize -Wrap
          if ($findings) { exit 1 }
      - name: setup.ps1 dry run
        if: runner.os == 'Windows'
        shell: powershell
        run: .\setup.ps1 install --dry-run --git-name ci --git-email ci@example.invalid

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks lists the PR's commits; needed on private repos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
